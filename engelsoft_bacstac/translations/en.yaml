# Modified by engelsofta in 2026 for Engelsoft BACstac; derived from the Bepacom BACnet/IP add-on.
configuration:
  objectName:
    name: BACnet · Device name
    description: The name of the interface in the BACnet network.
  address:
    name: BACnet · Interface address
    description: BACnet/IP host address. "auto" tries to automatically get your IP. x.x.x.x/24 format.
  objectIdentifier:
    name: BACnet · Device ID
    description: The identifier (number) of the interface.
  defaultPriority:
    name: Writing · Default priority (fallback)
    description: Used when the integration or API does not provide a write priority. Priority 1 is highest and priority 16 is lowest. Values 15 or 16 are recommended.
  managed_poll_rate:
    name: Updates · Polling interval
    description: Polling interval in seconds for targets assigned to polling by the integration. Lower values update faster but generate more BACnet traffic.
  managed_cov_subscription_delay_ms:
    name: Updates · Delay between COV subscriptions
    description: Delay in milliseconds between COV subscription requests. 1000 ms equals one second. Lower values build faster but can put more load on sensitive BACnet devices.
  managed_cov_subscription_delay:
    name: Compatibility · Legacy COV delay in seconds
    description: Deprecated seconds value from existing installations. Used only when the new millisecond value is absent.
  managed_cov_fallback_timeout:
    name: Updates · COV verification time
    description: Time before a gentle control poll starts when a confirmed COV subscription sends no notification. Permanent polling fallback occurs only after a value change without COV is proven.
  deviceID:
    name: Device protection · BACnet device
    description: BACnet device identifier in device:123 format. The value all defines the default rule for every device.
  CoV_lifetime:
    name: Device protection · COV lifetime
    description: Lifetime of a COV subscription in seconds. The add-on renews it automatically.
  CoV_limit:
    name: Device protection · Maximum COV subscriptions
    description: Maximum number of simultaneous COV subscriptions for each BACnet device. Additional objects are polled automatically. Set to 0 to disable COV for that device.
  resub_on_iam:
    name: Device protection · Restore COV after I-Am
    description: Checks COV subscriptions after a new I-Am message and restores missing subscriptions.
  reread_on_iam:
    name: Device protection · Check objects after I-Am
    description: Checks whether the device object list changed after an I-Am message.
  loglevel:
    name: Diagnostics · Log level
    description: The severity of log messages being displayed.
  maxApduLenghtAccepted: 
    name: Advanced · Maximum accepted APDU length
    description: Maximum amount of Application Layer Protocol Data Units allowed.
  segmentation:
    name: Advanced · Supported segmentation
    description: Supported segmentation type of the interface.
  vendorID:
    name: Advanced · Vendor identifier
    description: The vendor ID of the interface.
  foreignBBMD:
    name: Advanced · BBMD address
    description: IP address of the BBMD.
  foreignTTL: 
    name: Advanced · Foreign-device lifetime
    description: Time To Live of the packets sent for BBMD.
  maxSegmentsAccepted:
    name: Advanced · Maximum accepted segments
    description: The maximum amount of segments accepted in a message.
  devices_setup:
    name: BACnet · Device protection
    description: Safety limits and recovery behavior for each BACnet device. Most installations only need the existing all default rule.
  api_accessible:
    name: Access · Allow external API
    description: Allow API access from outside of Home Assistant.
network:
  47808/udp: BACnet port.
  80/tcp: Port which the integration should connect to. If you leave this empty, the integration should connect to port 8099.
