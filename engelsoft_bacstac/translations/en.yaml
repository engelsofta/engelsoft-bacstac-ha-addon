# Modified by engelsofta in 2026 for Engelsoft BACstac; derived from the Bepacom BACnet/IP add-on.
configuration:
  objectName:
    name: Device Name
    description: The name of the interface in the BACnet network.
  address:
    name: Interface IP
    description: BACnet/IP host address. "auto" tries to automatically get your IP. x.x.x.x/24 format.
  objectIdentifier:
    name: Device ID
    description: The identifier (number) of the interface.
  defaultPriority:
    name: BACnet write priority
    description: Priority of the BACnet write request. Priority 1 is highest, priority 16 is lowest it can go.
  subscription_mode:
    name: Integration update mode
    description: "Controls how BACstac works with Engelsoft Beacon BACnet/IP. managed_polling is the safe default and polls only objects requested by the integration. managed_cov creates limited COV subscriptions with automatic polling fallback. legacy uses only the device rules configured below."
  managed_poll_rate:
    name: Managed polling interval
    description: Polling interval in seconds when managed_polling is selected. Lower values update faster but generate more BACnet traffic.
  managed_cov_subscription_delay:
    name: Delay between COV subscriptions
    description: Delay in seconds between COV subscription requests to protect sensitive BACnet devices from request bursts.
  managed_cov_fallback_timeout:
    name: COV fallback timeout
    description: Seconds to wait for the first value notification after a confirmed COV subscription before polling takes over automatically.
  CoV_limit:
    name: Maximum COV subscriptions per device
    description: Maximum number of simultaneous COV subscriptions for each BACnet device. Additional objects are polled automatically. Set to 0 to disable COV for that device.
  loglevel:
    name: Level of Logging
    description: The severity of log messages being displayed.
  maxApduLenghtAccepted: 
    name: Maximum  APDU Length Accepted
    description: Maximum amount of Application Layer Protocol Data Units allowed.
  segmentation:
    name: Segmentation Supported
    description: Supported segmentation type of the interface.
  vendorID:
    name: Vendor Identifier
    description: The vendor ID of the interface.
  foreignBBMD:
    name: BACnet/IP Broadcast Management Device Address
    description: IP address of the BBMD.
  foreignTTL: 
    name: Foreign TTL
    description: Time To Live of the packets sent for BBMD.
  maxSegmentsAccepted:
    name: Maximum Segments Accepted
    description: The maximum amount of segments accepted in a message.
  devices_setup:
    name: Device Setup
    description: Set up any devices you want to be treated differently. See docs for usage.
  api_accessible:
    name: Allow API access
    description: Allow API access from outside of Home Assistant.
network:
  47808/udp: BACnet port.
  80/tcp: Port which the integration should connect to. If you leave this empty, the integration should connect to port 8099.
