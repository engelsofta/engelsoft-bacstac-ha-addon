# Modified by engelsofta in 2026 for Engelsoft BACstac; derived from the Bepacom BACnet/IP add-on.
configuration:
  objectName:
    name: BACnet · Gerätename
    description: Name, unter dem Engelsoft BACstac im BACnet-Netzwerk erscheint.
  address:
    name: BACnet · Schnittstellenadresse
    description: BACnet/IP-Adresse mit Präfix, zum Beispiel 192.168.1.10/24. Mit "auto" wird die Adresse automatisch ermittelt.
  objectIdentifier:
    name: BACnet · Geräte-ID
    description: Eindeutige BACnet-Gerätekennung dieser Schnittstelle.
  loglevel:
    name: Diagnose · Protokollierungsstufe
    description: Bestimmt, wie ausführlich Meldungen im Add-on-Protokoll ausgegeben werden.
  maxApduLengthAccepted:
    name: Erweitert · Maximale APDU-Länge
    description: Maximale Länge einer akzeptierten BACnet-APDU.
  segmentation:
    name: Erweitert · Unterstützte Segmentierung
    description: Segmentierungsart, die von dieser BACnet-Schnittstelle unterstützt wird.
  vendorIdentifier:
    name: Erweitert · Hersteller-ID
    description: BACnet-Herstellerkennung der Schnittstelle.
  foreignBBMD:
    name: Erweitert · BBMD-Adresse
    description: Adresse des BACnet Broadcast Management Device für den Foreign-Device-Betrieb.
  foreignTTL:
    name: Erweitert · Foreign-Device-Gültigkeitsdauer
    description: Gültigkeitsdauer der BBMD-Registrierung in Sekunden.
  maxSegmentsAccepted:
    name: Erweitert · Maximale Segmentanzahl
    description: Maximale Anzahl von Segmenten, die in einer BACnet-Nachricht akzeptiert wird.
network:
  47808/udp: BACnet/IP-Port
