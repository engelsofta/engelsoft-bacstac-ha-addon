# Modified by engelsofta in 2026 for Engelsoft BACstac; derived from the Bepacom BACnet/IP add-on.
configuration:
  objectName:
    name: BACnet · Gerätename
    description: Name, unter dem Engelsoft BACstac im BACnet-Netzwerk erscheint.
  address:
    name: BACnet · Schnittstellenadresse
    description: BACnet/IP-Adresse mit Präfix, zum Beispiel 192.168.1.10/24. Mit "auto" wird die Adresse automatisch ermittelt.
  objectIdentifier:
    name: BACnet · Geräte-ID
    description: Eindeutige BACnet-Gerätekennung dieser Schnittstelle.
  defaultPriority:
    name: Schreiben · Standardpriorität (Fallback)
    description: Wird verwendet, wenn Integration oder API keine eigene Schreibpriorität mitsendet. Priorität 1 ist die höchste, Priorität 16 die niedrigste. Empfohlen sind 15 oder 16.
  managed_poll_rate:
    name: Aktualisierung · Polling-Intervall
    description: Abfrageintervall in Sekunden für Ziele, denen die Integration Polling zuweist. Kleinere Werte liefern schnellere Aktualisierungen, erzeugen aber mehr BACnet-Datenverkehr.
  managed_cov_subscription_delay_ms:
    name: Aktualisierung · Abstand zwischen COV-Anmeldungen
    description: Wartezeit in Millisekunden zwischen zwei COV-Anmeldungen. 1000 ms entsprechen einer Sekunde. Kleinere Werte beschleunigen den Aufbau, können empfindliche BACnet-Geräte aber stärker belasten.
  managed_cov_fallback_timeout:
    name: Aktualisierung · COV-Prüfzeit
    description: Zeit bis zum Start eines schonenden Kontroll-Polls, wenn nach einer bestätigten COV-Anmeldung keine Meldung eintrifft. Erst nach nachgewiesener Wertänderung ohne COV wird dauerhaft auf Polling gewechselt.
  deviceID:
    name: Geräteschutz · BACnet-Gerät
    description: BACnet-Gerätekennung im Format device:123. Der Wert all gilt als Standardregel für alle Geräte.
  CoV_lifetime:
    name: Geräteschutz · COV-Laufzeit
    description: Gültigkeitsdauer einer COV-Anmeldung in Sekunden. Das Add-on erneuert sie automatisch.
  CoV_limit:
    name: Geräteschutz · Maximale COV-Anmeldungen
    description: Obergrenze gleichzeitig angelegter COV-Abonnements je BACnet-Gerät. Weitere Objekte werden automatisch gepollt. 0 deaktiviert COV für das Gerät.
  resub_on_iam:
    name: Geräteschutz · COV nach I-Am erneuern
    description: Prüft nach einer erneuten I-Am-Meldung des Geräts die COV-Anmeldungen und stellt fehlende wieder her.
  reread_on_iam:
    name: Geräteschutz · Objektliste nach I-Am prüfen
    description: Prüft nach einer I-Am-Meldung, ob sich die Objektliste des Geräts verändert hat.
  loglevel:
    name: Diagnose · Protokollierungsstufe
    description: Bestimmt, wie ausführlich Meldungen im Add-on-Protokoll ausgegeben werden.
  maxApduLenghtAccepted:
    name: Erweitert · Maximale APDU-Länge
    description: Maximale Länge einer akzeptierten BACnet-APDU.
  segmentation:
    name: Erweitert · Unterstützte Segmentierung
    description: Segmentierungsart, die von dieser BACnet-Schnittstelle unterstützt wird.
  vendorID:
    name: Erweitert · Hersteller-ID
    description: BACnet-Herstellerkennung der Schnittstelle.
  foreignBBMD:
    name: Erweitert · BBMD-Adresse
    description: Adresse des BACnet Broadcast Management Device für den Foreign-Device-Betrieb.
  foreignTTL:
    name: Erweitert · Foreign-Device-Gültigkeitsdauer
    description: Gültigkeitsdauer der BBMD-Registrierung in Sekunden.
  maxSegmentsAccepted:
    name: Erweitert · Maximale Segmentanzahl
    description: Maximale Anzahl von Segmenten, die in einer BACnet-Nachricht akzeptiert wird.
  devices_setup:
    name: BACnet · Geräteschutz
    description: Sicherheitsgrenzen und Wiederherstellungsverhalten je BACnet-Gerät. Für normale Installationen genügt die vorhandene Standardregel all.
network:
  47808/udp: BACnet/IP-Port
