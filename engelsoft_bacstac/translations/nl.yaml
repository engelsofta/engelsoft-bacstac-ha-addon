# Modified by engelsofta in 2026 for Engelsoft BACstac; derived from the Bepacom BACnet/IP add-on.
configuration:
  objectName:
    name: Device Naam
    description: Naam van het BACnet apparaat op het netwerk.
  address:
    name: Interface IP
    description: BACnet/IP host adres. "auto" probeert je LAN IP automatisch op te halen. {interface IP}/24 format.
  objectIdentifier:
    name: Device ID
    description: De identifier die je apparaat mee krijgt.
  defaultPriority:
    name: BACnet write priority
    description: Prioriteit van een BACnet schrijf request. 1 is hoogste en 16 is laagste prioriteit.
  subscription_mode:
    name: Updatemodus van de integratie
    description: "Bepaalt de samenwerking met Engelsoft Beacon BACnet/IP. managed_polling is de veilige standaard en pollt alleen objecten die de integratie nodig heeft. managed_cov gebruikt beperkte COV-abonnementen met automatische pollingfallback. legacy gebruikt uitsluitend de apparaatregels hieronder."
  managed_poll_rate:
    name: Beheerd pollinginterval
    description: Pollinginterval in seconden voor managed_polling. Lagere waarden zorgen voor snellere updates, maar genereren meer BACnet-verkeer.
  managed_cov_subscription_delay:
    name: Pauze tussen COV-abonnementen
    description: Wachttijd in seconden tussen COV-aanvragen om gevoelige BACnet-apparaten tegen aanvraagpieken te beschermen.
  managed_cov_fallback_timeout:
    name: COV-fallbacktijd
    description: Aantal seconden dat na een bevestigd COV-abonnement op de eerste waardemelding wordt gewacht voordat polling automatisch overneemt.
  CoV_limit:
    name: Maximum COV-abonnementen per apparaat
    description: Maximaal aantal gelijktijdige COV-abonnementen per BACnet-apparaat. Overige objecten worden automatisch gepolld. 0 schakelt COV voor dit apparaat uit.
  loglevel:
    name: Loggingsniveau
    description: Het niveau waarop de gebeurtenissen gelogd worden.
  maxApduLenghtAccepted: 
    name: Maximum  APDU Lengte Geaccepteerd
    description: Maximum hoeveelheid Application Layer Protocol Data Units toegestaan.
  segmentation:
    name: Segmentatie Ondersteund
    description: Ondersteunde type segmentatie. "segmentedBoth" als standaard.
  vendorID:
    name: Vendor Identifier
    description: Het ID van de regelaar's leverancier.
  foreignBBMD:
    name: BACnet/IP Broadcast Management Device Adres
    description: IP address van het BBMD.
  foreignTTL: 
    name: Foreign TTL
    description: Time To Live packets voor BBMD.
  maxSegmentsAccepted:
    name: Maximum Segmenten Geaccepted
    description: De maximale hoeveelheid segmenten er in een BACnet bericht mogen zitten.
  devices_setup:
    name: Apparaat configuratie
    description: Configureer apparaten die appart behandeld moeten worden. Zie documentatie over hoe deze optie gebruikt moet worden.
  api_accessible:
    name: Toegang tot API toestaan
    description: Sta toe dat de API toegankelijk is buiten Home Assistant.
network:
  47808/udp: BACnet poort.
  80/tcp: Poort waarmee de integration moet verbinden. Wanneer je deze poort leeg laat, moet de integration met poort 8099 verbinden.
