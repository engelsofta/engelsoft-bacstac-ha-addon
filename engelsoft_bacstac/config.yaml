# Modified by engelsofta in 2026 for Engelsoft BACstac; derived from the Bepacom BACnet/IP add-on.
# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Engelsoft BACstac
version: "1.2.13"
slug: engelsoft_bacstac
description: Engelsoft BACstac makes BACnet/IP devices available to Home Assistant through an API.
url: "https://github.com/engelsofta/engelsoft-bacstac-ha-addon"
image: "ghcr.io/engelsofta/engelsoft-bacstac"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_entry: webapp
host_network: true
hassio_api: true
panel_icon: mdi:router-wireless-settings
panel_title: Engelsoft BACstac
ports:
  80/tcp: null
  47808/udp: 47808
ports_description:
  80/tcp: Default webserver port
  47808/udp: BACnet port
options:
  objectName: Engelsoft BACstac
  address: auto
  objectIdentifier: 420
  subscription_mode: managed_polling
  managed_poll_rate: 10
  managed_cov_subscription_delay_ms: 1000
  managed_cov_fallback_timeout: 30
  defaultPriority: 15
  devices_setup:
    - deviceID: all
      CoV_lifetime: 600
      CoV_limit: 20
      CoV_list: []
      quick_poll_rate: 5
      quick_poll_list: []
      slow_poll_rate: 600
      slow_poll_list:
        - all
      resub_on_iam: true
      reread_on_iam: false
  api_accessible: false
  loglevel: WARNING
  segmentation: segmentedBoth
schema:
  objectName: str
  address: str
  objectIdentifier: int
  subscription_mode: list(integration_controlled|managed_polling|managed_cov|legacy)
  managed_poll_rate: int(3,300)
  managed_cov_subscription_delay_ms: int(0,30000)?
  managed_cov_fallback_timeout: int(10,600)
  defaultPriority: int(1,16)
  devices_setup:
    - deviceID: str? 
      CoV_lifetime: int(60,28800)?
      CoV_limit: int(0,1000)?
      CoV_list:
        - str? 
      quick_poll_rate: int(3,30)?
      quick_poll_list:
        - str? 
      slow_poll_rate: int(30,3000)?
      slow_poll_list:
        - str?
      resub_on_iam: bool?
      reread_on_iam: bool?
  api_accessible: bool?
  foreignBBMD: str?
  foreignTTL: int(1,65535)?
  vendorID: int?
  maxApduLenghtAccepted: int?
  segmentation: list(segmentedBoth|segmentedTransmit|segmentedReceive|noSegmentation)?
  maxSegmentsAccepted: int?
  managed_cov_subscription_delay: int(0,30)?
  loglevel: list(DEBUG|INFO|WARNING|ERROR|CRITICAL|)
