# Modified by engelsofta in 2026; derived from the Bepacom BACnet/IP add-on.
# Run nginx in foreground.
daemon off; 
# This is run inside Docker.
user root;
# Pid storage location.
pid /var/run/nginx.pid;
# Set number of worker processes.
worker_processes  1;
# Write error log to the add-on log
error_log /proc/1/fd/1 debug;

events {
    # Home Assistant Ingress only needs a small number of concurrent local
    # connections. Keep this below the container's soft open-file limit.
    worker_connections 512;
}

http {
    include             mime.types;
    default_type        application/octet-stream;
    sendfile            on;
    keepalive_timeout   65;
    proxy_read_timeout  1200;
    server_tokens off;


    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/servers/*.conf;
}
